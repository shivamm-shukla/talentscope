{% extends "shell.html" %}
{% block title %}Ask Santa — Santa{% endblock %}
{% block content %}
<section class="chat">
  <div class="chat-log" id="log" aria-live="polite">
    <div class="chat-intro" id="intro">
      <img class="mascot mascot-float" src="{{ url_for('static', filename='assets/santa-icon-192.png') }}" alt="" width="84" height="84">
      <h1>Ask Santa ✨</h1>
      <p class="soft">Your AI career companion — answers come from the live postings Santa is watching.</p>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>
  <form class="composer" id="composer">
    <label class="sr-only" for="question">Ask Santa</label>
    <textarea id="question" rows="1" placeholder="Ask anything about your career…" required></textarea>
    <button type="submit" class="icon-btn" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script>
const SUGGESTIONS = [
  'What skills are trending for ML interns in Bangalore?',
  'Which remote internships need React?',
  'What stipend should I expect as a 2nd-year?',
  'Give me a 4-week plan to become job-ready in backend',
];
const HISTORY_KEY = 'santa-chat';
const log = document.getElementById('log');
const intro = document.getElementById('intro');
const input = document.getElementById('question');
const send = document.getElementById('send');
let history = [];
try { history = JSON.parse(sessionStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) { history = []; }

function bubble(role, text, sources) {
  const row = document.createElement('div');
  if (role === 'me') {
    row.className = 'bubble me';
    row.textContent = text;
  } else {
    row.className = 'bubble-row';
    row.innerHTML = `<img src="/static/assets/santa-icon-64.png" alt=""><div class="bubble santa"></div>`;
    const b = row.querySelector('.bubble');
    if (text === null) b.innerHTML = '<span class="typing" aria-label="Santa is typing"><i></i><i></i><i></i></span>';
    else {
      b.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement('div');
        s.className = 'sources';
        s.innerHTML = sources.slice(0, 5).map((url, i) => `<a class="tag tag-accent" href="${escapeHTML(url)}" target="_blank" rel="noopener">Listing ${i + 1} ↗</a>`).join('');
        b.appendChild(s);
      }
    }
  }
  log.appendChild(row);
  intro.hidden = true;
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return row;
}

function persist() { try { sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-30))); } catch (e) { /* ignore */ } }

async function ask(question) {
  if (!question.trim()) return;
  if (!(await requireAccount('Ask Santa runs on AI, so it needs a free account — that keeps it fast for everyone.'))) {
    input.value = question;
    return;
  }
  input.value = '';
  autosize();
  bubble('me', question);
  history.push({ role: 'me', text: question });
  const pending = bubble('santa', null);
  send.disabled = true;
  const result = await fetchJSON('/qa', { method: 'POST', body: JSON.stringify({ question }) });
  send.disabled = false;
  pending.remove();
  const text = result.ok ? result.data.text : ((result.data && result.data.error) ? 'I couldn’t answer that just now — give me a moment and try again.' : 'Something went wrong on my side. Try again?');
  const sources = result.ok ? result.data.sources : [];
  bubble('santa', text, sources);
  history.push({ role: 'santa', text, sources });
  persist();
  input.focus();
}

function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }

document.getElementById('suggestions').innerHTML = SUGGESTIONS.map((s) => `<button type="button" class="chip">${escapeHTML(s)}</button>`).join('');
document.querySelectorAll('#suggestions .chip').forEach((chip) => chip.addEventListener('click', () => ask(chip.textContent)));
document.getElementById('composer').addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });
input.addEventListener('input', autosize);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } });

history.forEach((m) => bubble(m.role, m.text, m.sources));
</script>
{% endblock %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Santa — proactive career companion{% endblock %}</title>
  <script>
    // Runs before first paint so the page never flashes the wrong theme.
    // Explicitly stamping data-theme (rather than leaving it to the
    // prefers-color-scheme media query alone) is also what lets the
    // toggle button below override the OS setting per visitor.
    (function () {
      var stored = localStorage.getItem("santa-theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/logo.svg') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('pages.index') }}">
      <span class="brand-mark" role="img" aria-label="Santa"></span>
      <span class="brand-name">santa</span>
    </a>
    <nav class="site-nav">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      </button>
      {% if current_user.is_authenticated %}
        <a class="nav-link" href="{{ url_for('pages.feed') }}">Feed</a>
        <a class="nav-link" href="{{ url_for('pages.preferences_page') }}">Preferences</a>
        <button id="logout-btn" class="nav-link nav-link-btn">Log out</button>
      {% else %}
        <a class="nav-link" href="{{ url_for('pages.login_page') }}">Log in</a>
        <a class="btn btn-primary btn-sm" href="{{ url_for('pages.signup_page') }}">Get started</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>santa scout — internship &amp; job discovery, built to tell you before you ask.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

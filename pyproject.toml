[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentscope"
version = "0.1.0"
description = "Internship intelligence for closed-cohort students."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0,<26.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools]
packages = ["core", "db"]

[tool.pytest.ini_options]
addopts = "--cov=core --cov=db --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["core", "db"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentscope"
version = "0.1.0"
description = "Internship intelligence for closed-cohort students."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.13,<2.0",
    "APScheduler>=3.10,<4.0",
    "bcrypt>=4.0,<6.0",
    "Flask>=3.0,<4.0",
    "Flask-Login>=0.6,<1.0",
    "google-generativeai>=0.5,<1.0",
    "gunicorn>=22.0,<24.0",
    "playwright>=1.50,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0,<26.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-playwright>=0.7,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools]
packages = [
    "ai",
    "ai.providers",
    "analysis",
    "auth",
    "core",
    "db",
    "integrations",
    "integrations.github",
    "integrations.linkedin",
    "matching",
    "notifications",
    "sources",
    "web",
    "workers",
]

[tool.pytest.ini_options]
addopts = "--cov=core --cov=db --cov-report=term-missing --cov-fail-under=70 -m \"not live\""
testpaths = ["tests"]
markers = ["live: hits the real Gemini API; excluded from the default run"]

[tool.coverage.run]
branch = true
source = ["core", "db"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
